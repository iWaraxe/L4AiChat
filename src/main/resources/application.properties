spring.application.name=L4AiChat

# Server configuration
server.port=8080

# OpenAI API configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Model settings
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7

# Logging
logging.level.org.springframework.ai=INFO
logging.level.com.example.chatbotdemo=DEBUG

# Activate a specific profile by uncommenting one of these lines:
# spring.profiles.active=jdbc

# H2 Database Configuration (for JDBC profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JDBC Configuration (for JDBC profile)
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
