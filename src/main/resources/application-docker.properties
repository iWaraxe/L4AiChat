# Docker-specific configuration for L4AiChat

# Server configuration
server.port=8080

# Database configuration for Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/l4aichat
spring.datasource.username=l4aichat
spring.datasource.password=l4aichat123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis configuration (for future caching)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.data.redis.timeout=2000ms

# Actuator configuration for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# CORS configuration for Docker networking
cors.allowed-origins=http://localhost,http://localhost:80,http://localhost:3000

# JWT configuration
jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# OpenAI configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.7

# Logging configuration
logging.level.com.coherentsolutions.l4aichat=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application information
info.app.name=L4AiChat
info.app.description=Spring AI Course - Lecture 4 - AI Chat Application
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@