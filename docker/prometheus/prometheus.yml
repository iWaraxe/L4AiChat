global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'l4aichat-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['l4aichat-app:8080']
    scrape_interval: 10s
    labels:
      application: 'l4aichat'
      environment: 'docker'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    labels:
      service: 'postgres'
      
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    labels:
      service: 'redis'

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    labels:
      service: 'nginx'