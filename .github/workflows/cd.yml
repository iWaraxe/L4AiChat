name: Continuous Deployment

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Build application
      run: ./mvnw clean package -DskipTests

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy to staging environment
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Image: ${{ steps.meta.outputs.tags }}"
        # Add your staging deployment commands here
        # Examples:
        # - kubectl apply -f k8s/staging/
        # - docker-compose -f docker-compose.staging.yml up -d
        # - aws ecs update-service --cluster staging --service l4aichat

    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests against staging..."
        # Add your smoke test commands here
        # curl -f https://staging.l4aichat.com/api/health
        # npm run test:smoke

    - name: Notify staging deployment
      run: |
        echo "✅ Staging deployment completed successfully!"
        echo "Staging URL: https://staging.l4aichat.com"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    environment: production
    needs: []  # Remove staging dependency for direct production deployment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Build application
      run: ./mvnw clean package -DskipTests

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=production

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy to production environment
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Image: ${{ steps.meta.outputs.tags }}"
        # Add your production deployment commands here
        # Examples:
        # - kubectl apply -f k8s/production/
        # - docker-compose -f docker-compose.prod.yml up -d
        # - aws ecs update-service --cluster production --service l4aichat

    - name: Run production health checks
      run: |
        echo "🏥 Running production health checks..."
        # Add your health check commands here
        # curl -f https://l4aichat.com/api/health
        # kubectl get pods -l app=l4aichat

    - name: Notify production deployment
      run: |
        echo "✅ Production deployment completed successfully!"
        echo "Production URL: https://l4aichat.com"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    environment: production
    
    steps:
    - name: Rollback to previous version
      run: |
        echo "🔄 Rolling back to previous version..."
        # Add your rollback commands here
        # kubectl rollout undo deployment/l4aichat
        # docker-compose -f docker-compose.prod.yml down
        # docker-compose -f docker-compose.prod.yml up -d --scale l4aichat-app=0

    - name: Verify rollback
      run: |
        echo "✅ Rollback completed. Verifying system health..."
        # Add verification commands here

  notify-teams:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify Microsoft Teams
      if: always()
      uses: skitionek/notify-microsoft-teams@master
      with:
        webhook_url: ${{ secrets.TEAMS_WEBHOOK }}
        overwrite: |
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "${{ job.status == 'success' && '00FF00' || 'FF0000' }}",
            "summary": "L4AiChat Deployment Status",
            "sections": [{
              "activityTitle": "L4AiChat Deployment",
              "activitySubtitle": "Status: ${{ job.status }}",
              "facts": [
                {"name": "Repository", "value": "${{ github.repository }}"},
                {"name": "Branch/Tag", "value": "${{ github.ref }}"},
                {"name": "Commit", "value": "${{ github.sha }}"},
                {"name": "Actor", "value": "${{ github.actor }}"}
              ],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View in GitHub",
              "targets": [{"os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]
            }]
          }

    - name: Notify Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        text: |
          Deployment Status: ${{ job.status }}
          Repository: ${{ github.repository }}
          Branch/Tag: ${{ github.ref }}
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}