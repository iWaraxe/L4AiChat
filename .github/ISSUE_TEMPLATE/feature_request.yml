name: Feature Request
description: Suggest a new feature or enhancement for L4AiChat
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! 🚀
        
        Your ideas help make L4AiChat better for everyone learning Spring AI.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature are you requesting?
      options:
        - AI Chat Enhancement
        - New Spring AI Module
        - Security Improvement
        - Performance Optimization
        - Developer Experience
        - Documentation
        - Testing
        - Deployment/Infrastructure
        - Educational Content
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my use case
        - Critical - Blocking my progress
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief, clear summary of the feature you'd like to see
      placeholder: "In one or two sentences, describe what you want to be able to do"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        Describe the problem you're trying to solve:
        - What is the current situation?
        - What challenges are you facing?
        - Why is the current solution inadequate?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: |
        Describe your ideal solution:
        - How would this feature work?
        - What would the user experience be like?
        - How would it integrate with existing features?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
      placeholder: |
        What other approaches have you thought about?
        - Workarounds you've tried
        - Other tools or libraries that solve this
        - Different implementation approaches

  - type: textarea
    id: examples
    attributes:
      label: Examples and Use Cases
      description: Provide specific examples of how this feature would be used
      placeholder: |
        Example scenarios:
        1. When a student wants to...
        2. As a developer, I need to...
        3. In a production environment...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How would you know this feature is complete and working correctly?
      placeholder: |
        This feature would be complete when:
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: dropdown
    id: module
    attributes:
      label: Target Module
      description: Which module should this feature be added to?
      options:
        - s1-multiturn (Basic multi-turn conversations)
        - s2-components (Core Spring AI components)
        - s3-context (Context management)
        - s4-statemanagement (State management)
        - s5-chatbot (REST API chatbot)
        - s6-advanced (Advanced chat patterns)
        - s7-advisors (Custom advisors)
        - s8-multimodel (Multi-model AI)
        - s9-templates (Prompt engineering)
        - security-jwt-auth (Authentication)
        - containerization-docker (Docker setup)
        - New module needed
        - Cross-cutting concern
        - Not sure

  - type: checkboxes
    id: implementation
    attributes:
      label: Implementation Willingness
      description: Are you willing to help implement this feature?
      options:
        - label: I would like to implement this feature myself
        - label: I can help with testing and feedback
        - label: I can help with documentation
        - label: I can provide requirements clarification
        - label: I prefer someone else implements this

  - type: textarea
    id: technical
    attributes:
      label: Technical Considerations
      description: Any technical details, constraints, or considerations
      placeholder: |
        Technical aspects to consider:
        - Performance implications
        - Security considerations
        - Compatibility requirements
        - Dependencies needed
        - Breaking changes

  - type: checkboxes
    id: educational
    attributes:
      label: Educational Value
      description: How does this feature benefit learning Spring AI?
      options:
        - label: Demonstrates a new Spring AI concept
        - label: Shows best practices in AI development
        - label: Provides real-world use case example
        - label: Improves developer learning experience
        - label: Enhances understanding of AI integration patterns

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references
      placeholder: |
        Additional information:
        - Links to relevant documentation
        - Screenshots or mockups
        - Related issues or discussions
        - External examples or references